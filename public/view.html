<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>星光遊戲工作室｜作品試玩</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:#17123a;color:#fff}
header{padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#2a1b5e}
h1{margin:0;font-size:20px}.meta{opacity:.85;font-size:15px}
a.btn,button{font:inherit;font-weight:800;background:#ffc83d;color:#2b2358;border:0;border-radius:10px;padding:7px 16px;cursor:pointer;text-decoration:none}
#ed{width:100%;height:calc(100vh - 62px);background:#fff}#msg{padding:40px;text-align:center;font-size:20px}
</style></head><body>
<header><h1>🎮 <span id="t">載入中…</span></h1><span class="meta" id="m"></span><span style="flex:1"></span><a class="btn" id="dl" hidden>⬇ 下載 .sb3</a></header>
<div id="msg">作品準備中…（點綠旗開始玩）</div><div id="ed" hidden></div>
<script>
(async function () {
  var id = new URLSearchParams(location.search).get('id') || '', msg = document.getElementById('msg');
  try {
    var r = await fetch('/api/work?id=' + encodeURIComponent(id)); var w = await r.json();
    if (!r.ok) throw new Error(w.error || '讀取失敗');
    document.getElementById('t').textContent = w.name + ' 的接水果遊戲';
    document.getElementById('m').textContent = w.cls + '・最後更新 ' + new Date(w.updated).toLocaleString('zh-TW');
    if (!w.sb3Url) { msg.textContent = '這位同學還沒有上傳 Scratch 作品。'; return; }
    var dl = document.getElementById('dl'); dl.hidden = false; dl.href = w.sb3Url; dl.download = w.name + '_接水果.sb3';
    await new Promise(function (ok, no) { var s = document.createElement('script'); s.src = '/editor/scratch-gui-standalone.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
    var host = document.getElementById('ed'); host.hidden = false; msg.hidden = true;
    GUI.setAppElement(host);
    var state = new GUI.EditorState({locale: 'zh-tw'}), root = GUI.createStandaloneRoot(state, host), vm = null;
    root.render({isPlayerOnly: true, menuBarHidden: true, canSave: false, canEditTitle: false, backpackVisible: false, onVmInit: function (v) { vm = v; }});
    state.store.dispatch(GUI.setProjectId(String(GUI.defaultProjectId)));
    var t = setInterval(async function () {
      if (vm && vm.editingTarget) { clearInterval(t); var buf = await (await fetch(w.sb3Url)).arrayBuffer(); await vm.loadProject(buf); }
    }, 300);
  } catch (e) { msg.textContent = '😢 ' + e.message; }
})();
</script></body></html>
